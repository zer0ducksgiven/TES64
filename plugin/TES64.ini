[General]
; your Super Mario 64 (US) ROM; the installer fills this in
sRomPath=

[Controls]
; DirectInput scan codes. F10 = 68, V = 47
iToggleKey=68
iAttackKey=47
; Xbox pad (fixed): A jumps, Y punches/kicks, tap X dives (hold X: draw/sheathe), LB or left stick click crouches /
; ground-pounds

[Mario]
; Skyrim units per SM64 unit (0.48 makes Mario about 0.6x an NPC's height)
fScale=0.48
; Mario's punches/kicks/ground pounds on Skyrim actors (punch 10, kick 16, ground pound 30 health at 1.0)
fDamageMult=1.0
; Mario's voice and sound effects, from your ROM
bSounds=1
iVolume=80
; Skyrim's people comment on the plumber now and then
bNPCReactions=1
; blend Mario between the 30 Hz SM64 ticks so he moves smoothly at the game rate
bSmoothMotion=1

; Skyrim's torso and head movement on Mario in attacks (not just his arms)
bBodyPose=1

; SM64 music that follows what you do: the boss theme in fights, Bowser's in dragon fights (from your ROM)
bMusic=1
; the Bowser screen wipe and laugh when Mario dies
bDeathWipe=1
; how far above Mario's head the camera aims with weapons drawn (raises the crosshair so you don't aim at the ground)
fCombatCameraLift=60.0

; how close the third-person camera may zoom behind Mario: 0 is on top of him, 1 is the farthest Skyrim allows (0.05 - 0.6)
fMinCameraZoom=0.15

[HUD]
; size of Mario's meters, counters and compass
fScale=1.0
; hide the crosshair while weapons are away
bHideCrosshair=1
; SM64-style compass in place of Skyrim's
bCompass=1
; Skyrim's text in the SM64 font (Interface/fontconfig.txt is written at startup; restart after changing)
bSM64Fonts=1

[Debug]
; state lines in TES64.log every 0.1 s (for the test harness)
bTelemetry=0
